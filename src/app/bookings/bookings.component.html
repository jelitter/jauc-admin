<h1>Bookings list</h1>

<div class="mat-elevation-z8">
    <table mat-table class="full-width-table" [dataSource]="bookings" matSort aria-label="Elements">
        <ng-container matColumnDef="carId">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Car Id</th>
            <td mat-cell *matCellDef="let row">{{ row.carId }}</td>
        </ng-container>

        <ng-container matColumnDef="userId">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>User Id</th>
            <td mat-cell *matCellDef="let row">{{ row.userId }}</td>
        </ng-container>

        <ng-container matColumnDef="approvedBy">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Approved by</th>
            <td mat-cell *matCellDef="let row">{{ row.approvedBy }}</td>
        </ng-container>

        <ng-container matColumnDef="invoiceId">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Invoice Id</th>
            <td mat-cell *matCellDef="let row">{{ row.invoiceId }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
        #paginator
        [length]="bookings?.length"
        [pageIndex]="0"
        [pageSize]="10"
        [pageSizeOptions]="[10, 25, 50, 100]"
    >
    </mat-paginator>
</div>
